services:
  strapi:
    platform: linux/amd64
    container_name: strapi
    build: ./cms-strapi
    image: strapi:latest
    restart: unless-stopped
    env_file: ./cms-strapi/.env
    volumes:
      - ./cms-strapi:/opt/app
      - /opt/app/node_modules
      - ./cms-strapi/public/uploads:/opt/app/public/uploads
    ports:
      - "1337:1337"
    networks:
      - strapi
    depends_on:
      - strapiDB

  strapiDB:
    container_name: strapiDB
    platform: linux/amd64
    restart: unless-stopped
    env_file: ./cms-strapi/.env
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=admin123
      - MYSQL_DATABASE=strapi
      - MYSQL_USER=strapi
      - MYSQL_PASSWORD=N0928WZF52fVwfLE4q
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - strapi-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - strapi

  web:
    container_name: frontend
    build:
      context: ./frontend-next
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-next:/app
      - /app/node_modules
    working_dir: /app
    env_file: ./frontend-next/.env
    restart: always

volumes:
  strapi-data:

networks:
  strapi:
